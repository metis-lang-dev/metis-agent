# DEFAULT since 2026-10-11 (the user's switch decision, nina-harness step 4):
# gemma4 E2B Q4 as the intent model, the same as opus's E1 row
# "gemma-4-E2B-it-Q4_K_M" + p2ex: template gemma4, thinking off, the pass-2
# examples appended to the prompt (54/54 intents, 0 voice leaks); E2B +
# whisper base.en co-resident 2.37 GB on taycann. Switch rehearsal: the
# step-4 wsprobe list, no intent regression against gemma3. The gemma3:4b
# config is kept as the fallback, config.ws.gemma3.yaml.
# The harness behind the web UI (HARNESS.md §5-§6): the browser captures the
# mic (AudioWorklet → /ws_mic) and plays TTS (binary frames → tts_done); the
# dialog, VAD, ASR, intent and synthesis stay here. Events + chat + task
# feedback on /ws. Start with -ui-dir <metis-loop/apps/nina-web>.
llm:
    model: models/gemma4/gemma-4-E2B-it-Q4_K_M.gguf
    n_ctx: 4096
    n_batch: 512
    n_threads: 6
    n_gpu_layers: 99
    template: gemma4            # rendered by the adapter (TemplateGemma4); thinking stays off
    pass2: {temperature: 0.4, top_k: 40, max_tokens: 50}
stt:
    model: /home/axadmin/archive/vox/FSTTM/models/ggml-base.en-q5_1.bin
    language: en
    parasites: ["thank you", "thanks", "thanks for watching", "you"]
tts:
    engine: ws                  # RHVoice renders here, the browser plays (tts_done releases the floor)
    voice: SLT
    rate: 0.3
    volume: -0.1
vad: {aggressiveness: 3, padding_ms: 700}
aec: {enabled: false}           # local mics only; the browser's echoCancellation covers the remote mic
voice_id: {gate: "off"}
attention:                      # starts ASLEEP; wakes on the wake word, the UI's attention
    enabled: true               # switch (attention{AWAKE|ASLEEP}) or a mic grab; sleeps on
    wake_words: ["nina", "hey nina", "hello nina"]     # the sleep phrases, the switch or release
    sleep_phrases: ["go to sleep", "voice off", "stop listening", "that's all"]
transport: ws
mic: remote                     # 640-byte frames from /ws_mic (local = this machine's mic)
ws:
    addr: ":8392"
    ui_dir: ""                  # or -ui-dir on the command line
    tts_margin_s: 2             # tts_done wait beyond the audio length
    # tls_ca_cert / tls_ca_key / tls_addr / tls_leaf_dir / tls_san: https off localhost
announce_max_age_s: 30
task_max_age_s:                 # per command kind; task{progress} re-arms the window
    default: 60
    LOCAL_ACTION: 90
    STOP: 30
    CANCEL: 30
    NAVIGATE: 600
    EXPLORE: 600
    FOLLOW: 600
    GOTO_TAG: 600
prompt:  grammar/dog-prompt.txt
prompt_extra: [grammar/pass2-examples-gemma4.txt]   # gemma4 leaked JSON on CANCEL/UNKNOWN without them (E1)
grammar: grammar/dog.gbnf
barge_in: vad                   # the remote mic is echo-cancelled by Chrome: a VAD onset cuts TTS
# The runtime (runtime-wire step 2, internal/kernel): metis --json under a
# PortPlugin host; its signals reach the UI's events pane and the narrated
# ones the dialog. Off for the dog; `-kernel-host SPEC` turns it on.
kernel:
    enabled: false
    cmd: [python3, -m, metis.lang.repl]
    dir: ../../metispy
    host: metis.domains.kitchen.host:make   # make | make_transient | make_wrong_domain | make_novel
    catalog: metis/domains/kitchen/catalogs/kitchen_host.llp
    watch: every=0.5
    narrate: [surprise, consistent, episode_over]
    settle_beats: 2.5            # triage waits this many beats for the next reading before it asks the model
    # Rack phase 1b (docs/RAG.md §5): N runtimes on the one narrator, each its
    # own process; an entry's fields override the ones above. The kitchen pair
    # shares one env through METIS_PAIR_DIR (clear its kitchen-pair.json first).
    # runtimes:
    #   - {path: kitchen, host: "metis.domains.kitchen.pair:make_pair_kitchen",
    #      catalog: metis/domains/kitchen/catalogs/kitchen_host.llp, env: [METIS_PAIR_DIR=/tmp/pair]}
    #   - {path: kitchen_shared, host: "metis.domains.kitchen.pair:make_pair_shared",
    #      catalog: metis/domains/kitchen/catalogs/shared/kitchen_shared.llp, env: [METIS_PAIR_DIR=/tmp/pair]}
    rack:                        # per-domain tapes + the structural retriever (RAG §2–4)
        enabled: false
        budget: 2500             # tokens per insertion, mirror lines included
        wrap: true               # ⟪path: text⟫ fragments (false: "path: text.")
        ask: true                # the person's chitchat / off-map questions answered from ask()
