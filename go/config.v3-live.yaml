# metis-agent (docs/FRAMEWORK.md): the agent core + the console backend
# serving the fsttm-web page. One process owns the model (no llama-server
# beside it).
#
#   ./bin/metis-agent -config config.agent.yaml -ui-dir ../../fsttm-web/web
#   open http://localhost:8395/          (the page picks the ws backend by itself)
#
# The intent turn is config.ws.yaml's (the parity bar: gemma4 E2B Q4 + the
# gemma4 pass-2 examples, thinking off); talk mode is the free dialog on its
# own context of the same model.
llm:
    model: models/gemma4/gemma-4-E2B-it-Q4_K_M.gguf
    n_ctx: 4096
    n_batch: 512
    n_threads: 6
    n_gpu_layers: 99
    template: gemma4
    pass2: {temperature: 0.4, top_k: 40, max_tokens: 50}
# the catalog (metis-catalog, CATALOG.md "domain.yaml"): the intent material
# of every served domain that has it (intent.prompt, examples for the template
# above, grammar: generated from its intent.yaml, re-read after a reload) —
# the system turn opens with it and the person turn's grammar is made of it
# (e2e-workflow step 4: one intent domain, its own; several, every J names its
# domain); the domains' display names, clocks, partners and watched
# directories from their manifests; the console's list by the catalog's loader
catalog:
    root: ../../metis-catalog
    python: ../py/.venv/bin/python
talk:                            # say_text{mode: talk}: the free dialog (fsttm-web's long replies)
    prompt: grammar/talk-prompt.txt
    n_ctx: 4096
    temperature: 1.0
    top_k: 64
    top_p: 0.95
    min_p: 0.05
    repeat_penalty: 1.1
    max_tokens: 160
    keep_turns: 12
ws:
    addr: :8395

# integration step 2 (s-f82a578f): -loop v3 with the real domain agents —
#   ../run.sh            (from the metis-agent root: build if needed, start, print the URL; ../run.sh stop)
# which runs
#   ./bin/metis-agent -config config.v3-live.yaml -loop v3 -no-domains -wait-viewer -ui-dir ../../fsttm-web/web
# -loop v3 has no talk mode: talk: above is unused and every say_text, any
# mode, is a person turn of the orchestrator; -wait-viewer holds the clock
# until the first page connects. World lines (the person's hand on the
# dog's simulated world): ./bin/v3say -world "+arrived(kitchen)".
# one domain-agent process serves the dog and the kitchen pair on one model
# (nina ad9231b); the orchestrator owns time: each tick one dog beat and two
# kitchen env beats; the journal is the session's record for the E13 reads.
v3:
    prompt: [grammar/v3-orchestrator.txt]   # the orchestrator's part: the intent part before it is the manifests'
    # WHICH installed domains the orchestrator is offered (the operator's
    # selection; the manifests are the source, the config selects): each must
    # have a manifest in catalog.root (else the service refuses to start), and
    # the system turn's "## Domains" cards and the activate/deactivate enum are
    # built from those manifests' lines — never from literals here
    # (metis-agent -loop v3 -print-turn shows the turn; the console's list is
    # the catalog's whole list, not this selection)
    catalog: [kitchen]
    loaded: [dog, kitchen]
    n_ctx: 16384                # integration step 4 ruling: ~10k tokens of dialog room (+106 MiB); was 8192
    tick_ms: 1500
    journal: results/live/session.jsonl
    domains:
        - name: agents
          argv: [.venv/bin/python, -m, metis_agent.domain_agent, --domain, "dog,kitchen,kitchen_shared", --case, live, --narrate, dog, --trace, --records]
          # --records: the py domain agent's sink (DomainAgent.sink_record), the py service's own:
          # metis-catalog/domains/<n>/records/<session>.jsonl, session = the process's start time
          dir: ../py
          domains: [dog, kitchen, kitchen_shared]   # clocks (clock.beats), quiet partners (partner_of), the watched directories: their manifests
    # hot-install (e2e-workflow step 4): activate of a catalog domain no process
    # above serves builds its agent (and its pair's) from its manifest — its
    # clock, its card in the system turn, its name in the enum, its intent
    # material — and the dialog starts again on the rebuilt system turn. into:
    # the process above takes it ({"add"} on its line), so it shares that
    # process's model and consult seat (a surprise is consulted, escalated,
    # sunk); without into, argv starts a process of its own ("{domains}": the
    # domain and its pair), which has no model unless its argv loads one
    install:
        into: agents
