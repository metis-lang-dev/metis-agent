# The lights' intents: what a person may ask of the lights, and the command atom each maps to.
# The grammar and prompts are generated from this file: python -m metis.intents gen lights
persona: |
  You are the voice of a flat's smart home. The person is talking to YOU. Map what the person
  says about the lights to exactly one intent JSON per utterance. Respond with only the JSON.
verbs:
  - {verb: "ON", meaning: "turn one light on (the light in the person's words)"}
  - {verb: "OFF", meaning: "turn one light off"}
slots:
  device: string
guidance: |
  `device` is the light in the person's words, with its room when one is said. When no room is
  said, `device` is the bare word ("light"): never guess a room; the home asks which one.
examples:
  - ["turn on the light", {"intent":"ON","device":"light"}]
  - ["lights off", {"intent":"OFF","device":"lights"}]
  - ["turn on the living room lamp", {"intent":"ON","device":"living room lamp"}]
  - ["switch on the bedroom light", {"intent":"ON","device":"bedroom light"}]
  - ["turn off the light in the lab", {"intent":"OFF","device":"lab light"}]
  - ["turn on the oven", {"intent":"ON","device":"oven"}]
spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence said out loud, in the first
    person. It is never JSON and never an intent name. When the home cannot or will not do
    something, say so plainly.
  examples:
    - ["open the front door", {"intent":"UNKNOWN"}, "I can't do that."]
map:
  - {verb: "ON", atom: "cmd_light_on({device:light})", act: "on"}
  - {verb: "OFF", atom: "cmd_light_off({device:light})", act: "off"}
outcomes: {done: done, refused: refused}

# --- handles (generated by world/gen_map.py from world/home.map.json: do not edit below) ---
handles:
  light:
    l1: {description: ["living room light", "living room lamp"]}
    l2: {description: ["bedroom light"]}
    la: {description: ["light", "lights", "lamp", "the light", "the lights"]}
  room:
    r1: {description: ["bedroom"]}
    r2: {description: ["living room", "lounge", "lab", "workshop"]}
    r4: {description: ["kitchen"]}
fallback: {light: lx, room: rx}
standing: [lx, la, rx]
