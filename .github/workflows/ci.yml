name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # llama.cpp is the submodule third_party/llama.cpp: the pin IS its commit,
  # the one py's llama_cpp_python vendors (third_party/check-pin.sh, py job)
  # the metis runtime (go/internal/rt): metis-lang (public) at the commit the
  # binding is built and tested against; build.sh builds libmetis_rt there
  METIS_LANG_COMMIT: 18da80344eac87603b97b9d80b05004a80ac5ddd
  # metispy and metis-catalog are public siblings, checked out beside the repo

jobs:
  # console/: the page's journal model on the recorded journals (node, no deps)
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node console/test/console.mjs
        run: node console/test/console.mjs

  # go/: cgo against a CPU-only llama.cpp built in the submodule (cached on its commit)
  # and metis-lang's libmetis_rt at its pin (internal/rt: the goldens through
  # cgo, the K goldens through Go); vet, every cmd built, every package tested. Model-gated tests skip
  # without weights (go/models is not in git); the metispy-backed kernel test
  # runs on the checked-out metispy.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-agent
          submodules: true          # third_party/llama.cpp, shallow at its pin
      - name: The llama.cpp pin (the submodule's commit)
        id: pin
        run: echo "llama=$(git -C metis-agent rev-parse HEAD:third_party/llama.cpp)" >> "$GITHUB_OUTPUT"
      - name: Checkout metispy (public sibling)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-catalog (public sibling; the manifests internal/catalog reads)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: metispy's runtime for the kernel test
        run: |
          pip install -e ./metispy
          echo "METISPY=$GITHUB_WORKSPACE/metispy" >> "$GITHUB_ENV"
      # py/.venv: the Go tests that check the Go process against py's (the day replays from the
      # catalog: dog, plant, kitchen, love_triangle; the cgo kernel against py's domain agent; the
      # loader's list; the bundles' REPL API) run py's side there and skip without it. No
      # llama_cpp_python: no Go test loads weights through py
      - name: The py venv the Go tests run py's side in
        run: |
          python -m venv metis-agent/py/.venv
          metis-agent/py/.venv/bin/pip install -q -e ./metispy -e ./metis-catalog PyYAML==6.0.3 \
            "metis-loop-sdk @ git+https://github.com/metis-lang-dev/metis-loop@sdk-v0.1.6#subdirectory=sdk"
          cd metis-agent/py && .venv/bin/python -c "import metis.kernel.artifact, metis_agent.domain_agent"
      - name: Checkout metis-lang at the pin (public; the runtime internal/rt binds)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: ${{ env.METIS_LANG_COMMIT }}
          path: metis-lang
      - name: Cache libmetis_rt (the pinned commit)
        uses: actions/cache@v4
        with:
          path: metis-lang/runtime/build
          key: metis-rt-${{ runner.os }}-${{ env.METIS_LANG_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: metis-agent/go/go.mod
          cache-dependency-path: metis-agent/go/go.sum
      - name: Cache llama.cpp's build (CPU, the submodule's commit)
        id: llama
        uses: actions/cache@v4
        with:
          path: metis-agent/third_party/llama.cpp/build
          key: llama-cpu-${{ runner.os }}-${{ steps.pin.outputs.llama }}-${{ hashFiles('metis-agent/third_party/build-llama.sh', 'metis-agent/third_party/patches/**') }}
      - name: Build llama.cpp (CPU, in the submodule)
        if: steps.llama.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) metis-agent/third_party/build-llama.sh cpu
      - name: go vet
        working-directory: metis-agent/go
        env:
          METIS_LANG_DIR: ${{ github.workspace }}/metis-lang
        run: ./build.sh vet ./...
      - name: Build every cmd (metis-agent, llmbench, episodes, domemu)
        working-directory: metis-agent/go
        env:
          METIS_LANG_DIR: ${{ github.workspace }}/metis-lang
        run: |
          ./build.sh
          for c in metis-agent llmbench episodes domemu; do test -x "bin/$c" || { echo "::error::cmd $c not built"; exit 1; }; done
      - name: go test ./...
        working-directory: metis-agent/go
        env:
          METIS_LANG_DIR: ${{ github.workspace }}/metis-lang
        run: |
          rc=0
          ./build.sh test -count=1 -v ./... > go-test.log 2>&1 || rc=$?
          grep -E '^(ok|FAIL|--- FAIL|panic)|^\s+\S+_test\.go:[0-9]+:' go-test.log || true
          {
            echo "### go test: $(grep -c -- '--- PASS' go-test.log) passed, $(grep -c -- '--- SKIP' go-test.log) skipped, $(grep -c -- '--- FAIL' go-test.log) failed"
            echo '```'
            grep -B1 -- '--- SKIP' go-test.log | grep -v -- '--- SKIP' | grep -v '^--$' | sed 's/^ *//' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # py/: the specialist and the domain agent (py/tests). Every test file
  # imports metispy and reads metis-catalog (domains/dog, wolf-goat-cabbage),
  # both public siblings, checked out beside the repo.
  py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # py/ finds its siblings beside the repo (ROOT.parent/metis-catalog)
      - uses: actions/checkout@v4
        with:
          path: metis-agent
      - name: Checkout metispy (public sibling)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-catalog (public sibling)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metis-agent/py/requirements.txt
      - name: Install (llama_cpp_python builds CPU-only from source; the pip cache keeps the wheel)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
        run: |
          pip install -r metis-agent/py/requirements.txt
          pip install -e ./metispy
          pip install -e ./metis-catalog     # the domains' loader, which the loop SDK imports
          # the loop SDK at its tag (brief/repo-alignment.md §2): the one access to the
          # catalog, the CATALOG widget, the claude seat's process; after the two above,
          # which it names as dependencies
          # sdk-v0.1.6: the SDK the domain agent is tested against locally (metis-loop's sdk/ at
          # its head); v0.1.0 predates take, edit, the notch and an RDDL package's program
          pip install "metis-loop-sdk @ git+https://github.com/metis-lang-dev/metis-loop@sdk-v0.1.6#subdirectory=sdk"
      - name: One llama.cpp for both stacks (the submodule = llama_cpp_python's vendored commit)
        run: metis-agent/third_party/check-pin.sh python
      # nav's host steps the IPPC gym (metis-catalog tools/rddl_gym.py) in an interpreter of its
      # own: pyRDDLGym and rddlrepository, public on PyPI (MIT), pinned as the packages' .venv
      # has them; ~15 s and 181 MB with no pip cache. With it the RDDL tests run, required
      - name: The gym for the RDDL packages' hosts (its own venv, METIS_RDDL_PY)
        run: |
          python -m venv /tmp/gym
          /tmp/gym/bin/pip install -q pyRDDLGym==2.7 rddlrepository==2.2
          echo "METIS_RDDL_PY=/tmp/gym/bin/python" >> "$GITHUB_ENV"
      - name: pytest py/tests
        working-directory: metis-agent/py
        env: {METIS_AGENT_REQUIRE_GYM: '1'}
        run: python -m pytest -q tests
