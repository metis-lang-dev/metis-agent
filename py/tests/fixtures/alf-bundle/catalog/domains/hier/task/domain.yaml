# task — the task specialist over the role vocabulary, a member of the bundle (generated by world/gen_hier.py bundle);
# task_plain.llp beside it is the plain instance (the driver's, the eval's).
program: task.llp
host: alf_host.py:make
clock: {beats: 1}
records: records/
display: ALFWorld task
line: "task"
voice: own
shared: {inrecep: world-private, holds: world-private, absent: world-private, lost: world-private, believed: world-private, fetch_risk: world-private, seen: world-private, unseen: world-private, handsfree: world-private, presence: world-private, fetch: in, reached: in, accessible: in, taken: in, placed: in, refused_take: in, refused_put: in, refused: in, goto: out, open: out, take: out, put: out, done: out, stuck: out, wrong_dest: out, wrong_object: out, nothing: out, cannot: out, misfit: out, gave_up: out, tick__active: out, tick__done: out, tick__stuck: out, tick__cancel: in}
status: {success: [done, gave_up], failure: [stuck, wrong_dest, wrong_object, nothing, cannot, misfit]}
beliefs: {truly: {port: where, lone: R}}
evaluate: {fetch: {reach: done, within: 17, model: eval/world.llp}}
levels: {fetch_risk: {from: {evaluate: fetch}, at: [0.5, 0.9], names: [high, mid, low]}}
safety: []
belief: []
intent: {spec: intent/card.yaml}
