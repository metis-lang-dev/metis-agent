# the task's fetch under the one-tick instrument (spec16 s-b12d90f2 step 3; metis-lang spec/16 §2-§5): today's task, go_for @w look; a LONE belief (the target may be in no candidate)
program: world.llp
beliefs:
  truly: {port: where, lone: R}         # where the target is: at most one place, the rest nowhere the map asserts
levels:
  fetch_risk:                          # the fetch's failure risk within 17, the level the task reads
    from: {evaluate: fetch}
    at: [0.5, 0.9]
    names: [high, mid, low]
evaluate:
  first: {reach: done, within: 14}     # the first place tried is the right one (14 events: the fetch, there, back)
  fetch: {reach: done, within: 17}     # at most one wrong place (3 events each: go, absent, look elsewhere)
