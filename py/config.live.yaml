# The standalone agent (metis_agent.service; agent-console s-7f3d1088 step 2):
# the py backend of the console, the Go one's config.v3-live.yaml in its terms.
# Paths are relative to py/.
model: ../go/models/gemma4/gemma-4-E2B-it-Q4_K_M.gguf
# the person turn's intent pass: every served domain's intent material from its
# manifest (intent.prompt + examples[template], intent.grammar; e2e-workflow step 4,
# Go's 59854a2): one intent domain, its own turn and grammar; several, every J names
# its domain (--print-turn, --print-grammar show them)
template: gemma4
stop_words: [stop, halt, freeze, quiet]
v3:
    prompt: [../go/grammar/v3-orchestrator.txt]   # the orchestrator's part: the intent part before it is the manifests'
    # WHICH installed domains the orchestrator is offered (Go's config.v3-live.yaml,
    # 25ef76c): each must have a manifest (else the service refuses to start); the
    # system turn's "## Domains" cards and the activate/deactivate enum are built
    # from those manifests' lines (--print-turn shows the turn)
    catalog: [kitchen]
    loaded: [dog, kitchen]
    display: {kitchen_shared: second cook}
    n_ctx: 16384                 # integration step 4 ruling
    tick_ms: 1500
    journal: ../go/results/live/session-py.jsonl
domains:                         # in-process (no spawn), on the one loaded model
    names: [dog, kitchen, kitchen_shared]
    narrate: dog
    case: live
    seed: 1
    clocks: [{domain: dog, n: 1}, {domain: kitchen, n: 2}]
    quiet: [kitchen_shared]
    pairs: [[kitchen, kitchen_shared]]   # step and wait as one (one env)
    trace: true
    records: catalog             # metis-catalog/domains/<name>/records/<session>.jsonl
    narrator_n_ctx: 8192
    seat_n_ctx: 8192             # the consult's own context: another domain's narration never waits on it
    # every served domain's directory is watched (its manifest's; human-loop step 1):
    # a change is marked on its catalog row; reload: propose (the default: the page
    # proposes it, the band says STALE) | auto (at its next quiescence with no task),
    # from each manifest's reload: key — overridden here by one word or {name: policy}
    # reload: {dog: auto}
ws:
    addr: 127.0.0.1:8395
    ui: ../console
    lib: ../../fsttm-web/lib
